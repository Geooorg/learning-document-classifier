# Diese Datei wird nicht von Hand gepflegt und nicht neu gewürfelt. Eine neue Vorlage wird
# von scripts/generate_documents.py angehängt; bestehende Einträge ändern sich nie. Wer sie
# löscht, macht alle vorher gemessenen Zahlen unvergleichbar.
