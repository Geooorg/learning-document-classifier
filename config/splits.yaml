# Der Gold-Set-Schnitt, einmal gewürfelt und seither fest. Läuft über Vorlagen, nicht über
# Dokumente: Zehn Varianten einer Vorlage sind praktisch dasselbe Dokument und dürfen nicht
# auf beide Seiten fallen (Konzept § 9.2).
