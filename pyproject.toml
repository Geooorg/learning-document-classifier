[project]
name = "doccls"
version = "0.1.0"
description = "Lernfähige semantische Dokumentklassifikation"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "polars>=1.44.2",
    "puremagic>=1.28",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "duckdb>=1.5.5",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-openpyxl>=3.1.5.20260827",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "doccls"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # SWIG-Bindings in pymupdf melden unter Python 3.14 fehlende __module__-Attribute.
    # Fremdcode, nicht von uns behebbar. Eng gefasst, damit eigene Warnungen sichtbar bleiben.
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
# docs/ enthält Python-Beispiele in Markdown; ruff würde sie umformatieren.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
untyped_calls_exclude = ["pymupdf"]
# pymupdf bringt py.typed mit, annotiert seine Funktionen aber nicht. Ohne diese Ausnahme
# müsste jede Aufrufstelle einzeln entschärft werden; disallow_untyped_calls bleibt für
# alles Übrige in Kraft.

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
# scikit-learn liefert keinen py.typed-Marker (Stand 1.9.1, geprüft). Das inoffizielle
# Paket scikit-learn-stubs (0.0.3, seit August 2025 unverändert) bündelt Microsofts Stubs,
# die älter sind als 1.9 – als Abhängigkeit nicht tragfähig. follow_untyped_imports statt
# dieser Ausnahme ergab 8 no-untyped-call-Meldungen ohne Ursache im eigenen Code.
# Folge der Ausnahme: sklearn-Objekte sind für mypy Any. Deshalb wird jeder Rückgabewert
# aus sklearn an der Modulgrenze in einen eigenen Typ überführt (np.asarray mit dtype,
# str je Vokabulareintrag; features/ngrams.py), damit kein Any weiterwandert.
